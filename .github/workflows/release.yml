name: Release

# Pushing a version tag publishes downloadable binaries:
#   git tag -s v0.1.0 -m 'kernelctl 0.1.0' && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  # Needed to create the release and attach binaries to it.
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built natively on each architecture where a runner exists, so the
          # artefact is tested and executed on the machine type it targets.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            native: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            native: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            native: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            native: true
          # 32-bit ARM, which the project supports but GitHub has no runner
          # for. Cross-compiled only: it is proven to build, not to run, and
          # the release notes say so rather than implying equal confidence.
          # The musl variant is used because it links self-contained, so no
          # cross C toolchain is needed for this pure-Rust dependency graph.
          - target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            native: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Every dependency is pure Rust - rustix talks to the kernel directly
      # and flate2 uses its Rust backend - so a musl build needs no C
      # toolchain. musl-tools is installed anyway so a future dependency
      # that does need a linker fails at review time, not release time.
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl') && matrix.native
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Cross-building for ARM needs a linker driver for that architecture;
      # rust supplies the musl libc itself, so no C is compiled.
      - name: Install the ARM linker driver
        if: matrix.target == 'armv7-unknown-linux-musleabihf'
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      # A tag that does not match Cargo.toml means someone forgot to bump the
      # version; catching it here beats publishing a mislabelled release.
      - name: Tag must match the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          crate="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

      - name: Test
        if: matrix.native
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-gnueabihf-gcc

      - name: Verify the binary
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/kernelctl"
          file "$bin"
          # Only executable here when the runner shares the target's
          # architecture; the cross-built one is checked structurally instead.
          if [ "${{ matrix.native }}" = "true" ]; then
            "$bin" --version
          else
            file "$bin" | grep -q 'ARM' || { echo "::error::not an ARM binary"; exit 1; }
          fi
          # A musl build must be static - that is the whole point of shipping
          # one, since the glibc builds will not run on an older distribution.
          # Checked with file(1) rather than ldd: ldd cannot inspect a
          # cross-built binary, and Rust emits static-pie for several musl
          # targets, which is still static.
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            if ! file "$bin" | grep -qE 'statically linked|static-pie linked'; then
              echo "::error::musl build is not statically linked"
              file "$bin"
              exit 1
            fi
          fi

      - name: Package
        run: |
          set -euo pipefail
          name="kernelctl-${GITHUB_REF_NAME:-dev}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/kernelctl" "dist/$name/"
          cp README.md LICENSE LICENSING.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file covering every archive is easier to verify against
      # than four separate ones.
      - name: Collect checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum *.tar.gz > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Downloads

            | Build | Use it when |
            |---|---|
            | `x86_64-unknown-linux-musl` | **AMD64, any distribution** - statically linked, no glibc requirement |
            | `aarch64-unknown-linux-musl` | **ARM64, any distribution** - statically linked |
            | `x86_64-unknown-linux-gnu` | AMD64, glibc 2.39 or newer |
            | `aarch64-unknown-linux-gnu` | ARM64, glibc 2.39 or newer |
            | `armv7-unknown-linux-musleabihf` | **32-bit ARM** (Raspberry Pi 2/3 in 32-bit mode, older boards) |

            The ARMv7 build is cross-compiled and, unlike the others, is not executed
            in CI — GitHub has no 32-bit ARM runner. It is known to compile and link;
            please report anything that misbehaves on real hardware.

            If unsure, take the **musl** build for your architecture: it has no
            runtime dependencies at all and runs on old and new distributions alike.

            ```sh
            tar xzf kernelctl-*-linux-musl.tar.gz
            sudo install -m755 kernelctl-*/kernelctl /usr/local/bin/kernelctl
            kernelctl status
            ```

            Verify a download against `SHA256SUMS`:

            ```sh
            sha256sum -c SHA256SUMS --ignore-missing
            ```

            Reading boot configuration needs no privileges; changing it needs root.
