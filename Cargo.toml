[package]
name = "kernelctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unified kernel and boot configuration management across every Linux bootloader"
authors = ["Luka Gejak <luka.gejak@linux.dev>"]
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["kernel", "bootloader", "grub", "systemd-boot", "tui"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
ratatui = "0.29"
crossterm = "0.28"
rustix = { version = "0.38", features = ["fs", "system", "process", "thread", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
glob = "0.3"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# `panic = "abort"` is incompatible with the test harness, so keep unwinding
# for test builds only.
[profile.test]
panic = "unwind"

[profile.bench]
panic = "unwind"
